<div class="weather-atmosphere" [ngClass]="backgroundClass()">

    <div class="floating-glow glow-1"></div>
    <div class="floating-glow glow-2"></div>

    <div class="weather-particles"></div>

    @if (backgroundClass() === 'rainy') {

    <div class="rain-layer"></div>

    }
    @if (backgroundClass() === 'storm') {

    <div class="lightning-flash"></div>

    }

    @if (
    backgroundClass() === 'cloudy' ||
    backgroundClass() === 'rainy' ||
    backgroundClass() === 'storm'
    ) {

    <div class="cloud-layer layer-1"></div>

    <div class="cloud-layer layer-2"></div>

    }

    @if (backgroundClass() === 'sunny') {

    <div class="sun-rays"></div>

    <div class="sun-particles"></div>

    }

</div>

<div class="cursor-glow"></div>

<div class="weather-dashboard" [class.loading-transition]="isLoading()" [class.sunny-atmosphere]="
        backgroundClass() === 'sunny'
    " [class.cloudy-atmosphere]="
        backgroundClass() === 'cloudy'
    " [class.rainy-atmosphere]="
        backgroundClass() === 'rainy'
    ">

    <div class="dashboard-top">

        <app-weather-search [isLoading]="isLoading()" [suggestions]="suggestions()" (search)="searchCity($event)"
            (searchInputChange)="
                searchSuggestions($event)
            " />

    </div>

    <div class="dashboard-hero">

        <app-weather-hero [temperature]="temperature()" [feelsLike]="feelsLike()" [conditionIcon]="conditionIcon()"
            [city]="city()" [condition]="condition()" [localTime]="formattedLocalTime()" [greeting]="greeting()"
            [isLoading]="isLoading()" />

    </div>

    <div class="dashboard-forecast">

        <app-forecast-timeline [forecast]="forecast()" />

    </div>
    <app-daily-forecast [forecast]="dailyForecast()" />
    <app-temperature-chart [forecast]="forecast()" />
    <app-weather-map [city]="city()" [latitude]="latitude()" [longitude]="longitude()" />
    <app-weather-insight [insight]="streamedInsight()" [isLoading]="isInsightLoading()" />

    <div class="dashboard-stats">

        @for (
        stat of stats();
        track stat.label
        ) {

        <app-stat-card [label]="stat.label" [value]="stat.value" [isLoading]="isLoading()" />

        }

    </div>

</div>
