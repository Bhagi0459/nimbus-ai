<div class="insight-card">

    <div class="insight-label">
        Nimbus AI Insight
    </div>

    @if (isLoading()) {

    <div class="thinking-state">

        <div class="thinking-dot"></div>

        <span>
            Analyzing weather patterns...
        </span>

    </div>

    } @else {

    @if (insight()) {

    <p class="insight-text">
        {{ insight() }}
    </p>

    }

    }

</div>
