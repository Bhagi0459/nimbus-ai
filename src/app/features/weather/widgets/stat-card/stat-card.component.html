<div class="metric-pill">

    @if (isLoading()) {

    <div class="skeleton skeleton-pill"></div>

    } @else {

    <div class="metric-content">

        <span class="metric-label">

            {{ label() }}

        </span>

        <span class="metric-value">

            {{ value() }}

        </span>

    </div>

    }

</div>
