<div class="metric-card">
    @if (isLoading()) {
    <div class="skeleton skeleton-card"></div>
    } @else {
    <div class="metric-content">
        <div class="metric-header">
            <span class="metric-icon">
                @switch (icon()) {
                @case ('droplet') { 💧 }
                @case ('wind') { 🌬️ }
                @case ('sun') { ☀️ }
                @case ('thermometer') { 🌡️ }
                @case ('eye') { 👁️ }
                @case ('gauge') { 📈 }
                @case ('cloud') { ☁️ }
                @case ('zap') { ⚡ }
                }
            </span>
            <span class="metric-label"> {{ label() }} </span>
        </div>
        <div class="metric-value"> {{ value() }} </div>
    </div>
    }
</div>
