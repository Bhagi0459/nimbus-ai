<div class="hero-card">

    @if (isLoading()) {

    <div class="skeleton skeleton-temp"></div>

    <div class="skeleton skeleton-city"></div>

    <div class="skeleton skeleton-condition"></div>

    } @else {

    <div class="hero-main">

        <div class="hero-left">

            <h2>{{ temperature() }}</h2>

            <p class="feels-like">
                Feels like {{ feelsLike() }}
            </p>

            <h3>{{ city() }}</h3>

            <p class="condition">
                {{ condition() }}
            </p>

        </div>

        <div class="hero-right">

            <img [src]="conditionIcon()" [alt]="condition()" />

        </div>

    </div>

    }

</div>
